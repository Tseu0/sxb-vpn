name: Compiler APK Android TSEU VPN (Xray + Securite SXB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build TSEU VPN Release APK (with Xray Core)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code source
        uses: actions/checkout@v4

      - name: 2. Téléchargement du moteur Xray officiel (libv2ray.aar)
        working-directory: ./android-client/app
        run: |
          mkdir -p libs
          curl -sSL -o libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
          ls -lh libs/libv2ray.aar

      - name: 3. Installation de Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Génération du certificat de signature officiel (Release Keystore)
        working-directory: ./android-client/app
        run: |
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias sxbkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sxbpassword2026 \
            -keypass sxbpassword2026 \
            -dname "CN=TSEU VPN Official, OU=Mobile, O=TSEU, L=Paris, S=IDF, C=FR"

      - name: 5. Configuration automatique de Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 6. Compilation du fichier APK Release Signé & Obfusqué (R8)
        working-directory: ./android-client
        run: gradle assembleRelease --no-daemon

      - name: 7. Publication de l'APK Release prêt à installer
        uses: actions/upload-artifact@v4
        with:
          name: TSEU-VPN-Release-APK
          path: android-client/app/build/outputs/apk/release/*.apk
