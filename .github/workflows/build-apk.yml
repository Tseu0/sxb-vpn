name: Compiler APK Android SXB VPN (Cloud Gratuit)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build SXB VPN Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code source
        uses: actions/checkout@v4

      - name: 2. Installation de Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configuration automatique de Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Compilation du fichier APK installable
        working-directory: ./android-client
        run: gradle assembleDebug --no-daemon

      - name: 5. Publication de l'APK prêt à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: SXB-VPN-Android-APK
          path: android-client/app/build/outputs/apk/debug/*.apk
